name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags/releases created with GITHUB_TOKEN do not trigger other workflows,
  # so dispatch the publish workflows explicitly on the new tag.
  trigger-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger PyPI and Docker publish
        uses: actions/github-script@v7
        with:
          script: |
            for (const workflow_id of ['pypi.yml', 'docker.yml']) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: '${{ needs.release-please.outputs.tag_name }}'
              })
            }
